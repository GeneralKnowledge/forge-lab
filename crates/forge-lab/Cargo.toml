[package]
name = "forge-lab"
version = "0.1.0"
description = "Agent and live-connection tooling on top of ixOS's forge: the MCP server and `forge-lab device`"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "forge-lab"
path = "src/main.rs"

[dependencies]
forge-mcp = { path = "../forge-mcp" }
forge-live = { path = "../forge-live" }
forge-device = { workspace = true }
forge-devproto = { workspace = true }
clap = { version = "=4.6.7", features = ["derive", "env"] }

[dev-dependencies]
# The live-connection tests run against the real app-side server.
forge-devtools = { path = "../forge-devtools" }
forge-runtime = { workspace = true }
tempfile = "3.14"
